name: Build Android APK

# यह वर्कफ़्लो तब चलेगा जब आप main ब्रांच पर कोड push करेंगे
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Repo का सारा कोड चेकआउट करना
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Java (JDK 17) सेटअप करना
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Step 3: Gradle Wrapper को एग्जीक्यूट होने की परमिशन देना
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Step 4: Debug APK बिल्ड करना
    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    # Step 5: जनरेट हुई APK को GitHub Actions Artifacts में अपलोड करना (ताकि आप डाउनलोड कर सकें)
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
