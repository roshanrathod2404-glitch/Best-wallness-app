name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Repository checkout
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Step 2: Java (JDK 17) Setup
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    # Step 3: Check and Fix Gradle Setup
    - name: Build APK (Auto-Detect Gradle)
      run: |
        if [ -f "./gradlew" ]; then
          echo "Gradle wrapper found! Using gradlew..."
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
        else
          echo "Gradle wrapper missing! Installing system Gradle..."
          sudo apt-get update
          sudo apt-get install -y gradle
          gradle assembleDebug --stacktrace
        fi

    # Step 4: Upload generated APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: "**/build/outputs/apk/debug/*.apk"
