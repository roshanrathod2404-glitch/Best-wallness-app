name: Build Android APK
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Repository checkout
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Install Gradle directly (this guarantees the `gradle` command exists)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Step 4: Generate gradlew if missing, then make it executable
      - name: Prepare Gradle Wrapper
        run: |
          echo "Checking for gradlew..."
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating it now..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew
          echo "gradlew is ready:"
          ls -la gradlew

      # Step 5: Build Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Step 6: Upload generated APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
